<svg width="1280" height="280" viewBox="0 0 1280 280" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- =============================================================
       EDIT COLOURS HERE. Change the hex values in :root to recolour.
         bg-dark / bg-light : background gradient
         accent-a / accent-b: mark and heading underline gradient
         highlight          : meridian line and centre dot
         text-main          : your name
         text-sub           : subtitle
         text-tag           : tagline line
       ============================================================= -->
  <style>
    :root {
      --bg-dark:   #06101e;
      --bg-light:  #0a1320;
      --accent-a:  #21d4c4;
      --accent-b:  #3aa0ff;
      --highlight: #ff6b5e;
      --text-main: #ffffff;
      --text-sub:  #7a8aa0;
      --text-tag:  #9fb0c4;
    }
    .bg-dark  { stop-color: var(--bg-dark); }
    .bg-light { stop-color: var(--bg-light); }
    .acc-a    { stop-color: var(--accent-a); }
    .acc-b    { stop-color: var(--accent-b); }
    .glow-a   { stop-color: var(--accent-a); }
    .name     { fill: var(--text-main); }
    .sub      { fill: var(--text-sub); }
    .tag      { fill: var(--text-tag); }
    .underline{ fill: var(--accent-a); }
    .mark     { stroke: url(#signal); }
    .ring     { stroke: var(--accent-a); }
    .ring2    { stroke: var(--accent-b); }
    .scan     { stroke: var(--accent-a); }
    .hl-stroke{ stroke: var(--highlight); }
    .hl-fill  { fill:   var(--highlight); }

    .r1 { transform-origin: 1050px 140px; animation: pulse 4s ease-in-out infinite; }
    .r2 { transform-origin: 1050px 140px; animation: pulse 4s ease-in-out infinite 1.3s; }
    .sweep { animation: sweep 6s linear infinite; transform-origin: 1050px 140px; }
    .blink { animation: blink 2.4s ease-in-out infinite; }
    @keyframes pulse { 0% { transform: scale(0.4); opacity: 0.9; } 100% { transform: scale(1.6); opacity: 0; } }
    @keyframes sweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" class="bg-dark"/>
      <stop offset="100%" class="bg-light"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" class="acc-a"/>
      <stop offset="100%" class="acc-b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" class="glow-a" stop-opacity="0.18"/>
      <stop offset="100%" class="glow-a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="280" fill="url(#bg)"/>
  <rect width="1280" height="280" fill="url(#grid)"/>
  <circle cx="1050" cy="140" r="180" fill="url(#glow)"/>

  <text class="name" x="80" y="118" font-size="46" font-weight="800" letter-spacing="1">Michale McCarthy</text>
  <text class="sub" x="82" y="156" font-size="18" letter-spacing="3">DEVELOPER &amp; SECURITY ENGINEER</text>
  <rect class="underline" x="82" y="180" width="40" height="3"/>
  <text class="tag" x="82" y="214" font-size="19" font-family="'Courier New', monospace">The hard decisions belong in the code.</text>

  <g>
    <circle class="r1 ring" cx="1050" cy="140" r="50" fill="none" stroke-width="2"/>
    <circle class="r2 ring2" cx="1050" cy="140" r="50" fill="none" stroke-width="2"/>
    <circle class="mark" cx="1050" cy="140" r="56" fill="none" stroke-width="2.5"/>
    <line class="hl-stroke" x1="980" y1="140" x2="1120" y2="140" stroke-width="2.5"/>
    <line class="sweep scan" x1="1050" y1="140" x2="1050" y2="84" stroke-width="2" stroke-opacity="0.7"/>
    <circle class="blink hl-fill" cx="1050" cy="140" r="6"/>
  </g>
</svg>
